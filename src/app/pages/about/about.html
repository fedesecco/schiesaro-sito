<section class="route-shell about-page screen-scroll">
  <header class="site-chrome site-chrome--static">
    <div class="chrome-grid">
      <a class="chrome-grid__brand" routerLink="/home">{{ siteTitle }}</a>
    </div>
  </header>

  <main class="layout-grid about-page__content">
    <h1 class="about-page__title">About</h1>

    <div class="about-page__contacts">
      @for (contact of about.contacts; track contact.email) {
        <div class="about-page__contact">
          <span>{{ contact.name }}</span>
          <a href="mailto:{{ contact.email }}">{{ contact.email }}</a>
          <a href="tel:{{ contact.phone }}">{{ contact.phone }}</a>
        </div>
      }
    </div>
  </main>

  <footer class="about-page__footer">
    <a href="mailto:{{ about.email }}">{{ about.email }}</a>
    <div class="about-page__locations" aria-label="Studio locations">
      @for (city of about.cities; track city) {
        <span>{{ city }}</span>
      }
    </div>
    <span>{{ about.countryCode }}</span>
  </footer>
</section>
